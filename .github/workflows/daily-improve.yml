name: Daily Improvement Agent

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Force a specific day number (blank = auto-pick next pending)'
        required: false
        type: string

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Phase 1 — Generate improvement
        id: phase1
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAY_OVERRIDE:              ${{ github.event.inputs.day_override }}
        run: |
          npx tsx scripts/daily-improve.ts
          if [ -f /tmp/gr-day ]; then
            echo "has_work=true" >> $GITHUB_OUTPUT
          else
            echo "has_work=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.phase1.outputs.has_work == 'true'
        run: |
          git config user.name "Green Rides Improvement Agent"
          git config user.email "agent@greenrides.co.in"
          git checkout -- package-lock.json 2>/dev/null || true
          git add -A
          git diff --staged --quiet || git commit -m "improve(day-$(cat /tmp/gr-day)): $(cat /tmp/gr-title)"
          git push

      - name: Deploy to Vercel
        id: vercel_deploy
        if: steps.phase1.outputs.has_work == 'true'
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     team_2kOfHI6diUznVNSYCoXLduWL
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel --prod --token $VERCEL_TOKEN --yes 2>&1 | tee /tmp/vercel-out.txt
          echo "done=1" >> $GITHUB_OUTPUT

      - name: Phase 2 — Smoke test and notify
        if: steps.phase1.outputs.has_work == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN:              ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID:         ${{ secrets.VERCEL_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOYMENT_DONE:           ${{ steps.vercel_deploy.outputs.done }}
        run: npx tsx scripts/post-deploy.ts
